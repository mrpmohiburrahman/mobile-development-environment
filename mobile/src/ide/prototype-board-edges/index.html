<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE — board edges</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #F4EFE8; font-family: ui-monospace, Menlo, monospace; color: #3D332A; }

  #host { position: relative; min-height: 100vh; overflow: auto; }

  /* Legend + controls — studio chrome above the board. */
  #legend {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 24px; font-size: 12px; border-bottom: 1px solid #DED5C6;
    background: #FBF8F2;
  }
  #legend i { display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; }
  #legend i.dashed { background-image: linear-gradient(90deg, #8A7E6E 60%, transparent 40%); background-size: 8px 3px; background-color: transparent; }
  #legend button, #switcher button {
    font: inherit; border: 1px solid #C9BFAE; background: #fff; border-radius: 6px;
    padding: 3px 10px; cursor: pointer;
  }
  #event-line { color: #8A7E6E; }

  /* The board: a scaled row of phone frames, matching Blueprint.tsx. */
  .board { position: relative; display: flex; gap: 32px; padding: 24px; align-items: flex-start; width: max-content; overflow: visible; }
  #edge-layer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; overflow: visible; }

  .frame { width: 390px; flex: none; cursor: default; transition: opacity 120ms; }
  .frame-label { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px; color: #8A7E6E; }
  .frame-label .chip {
    width: 22px; height: 22px; border-radius: 999px; background: #D9481E; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
  }
  .frame-label .rule { flex: 1; height: 1px; background: #DED5C6; }

  .phone {
    width: 390px; height: 820px; border-radius: 30px; overflow: hidden;
    border: 1px solid #DED5C6; background: #fff;
    box-shadow: 0 2px 10px rgba(61, 51, 42, 0.08);
  }
  .phone-screen { padding: 24px 18px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
  .mock-header { font-weight: 700; font-size: 17px; }
  .mock-tabs { margin-top: auto; letter-spacing: 18px; color: #C9BFAE; font-size: 18px; }
  .mock-back { color: #8A7E6E; font-size: 13px; }
  .mock-press {
    align-self: flex-start; font: inherit; font-size: 12px; padding: 6px 14px;
    border-radius: 8px; border: 1px solid #DED5C6; background: #F4EFE8; cursor: pointer;
  }

  /* Floating variant switcher. */
  #switcher {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 50;
    background: #26201A; color: #F4EFE8; border-radius: 999px; padding: 6px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); font-size: 12px;
  }
  #switcher button { background: transparent; border: 1px solid #5A5044; color: inherit; border-radius: 999px; width: 28px; height: 28px; padding: 0; }
</style>
</head>
<body>
  <div id="host"></div>
  <script src="./board-edges.js"></script>
</body>
</html>
