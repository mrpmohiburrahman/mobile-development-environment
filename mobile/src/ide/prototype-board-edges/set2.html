<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE — board edges, set 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #F4EFE8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #3D332A; }

  #host { position: relative; min-height: 100vh; overflow: auto; }

  #legend {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 24px; font-size: 13px; border-bottom: 1px solid #E7DFD2;
    background: rgba(244, 239, 232, 0.92); backdrop-filter: blur(6px);
  }
  #legend button, #switcher button {
    font: inherit; font-size: 13px; border: 1px solid #D9D0C2; background: #fff; border-radius: 8px;
    padding: 4px 12px; cursor: pointer; color: #3D332A;
  }
  #legend button:hover { border-color: #C2410C; }
  #event-line { color: #8A7E6E; }
  #scale-label { margin-left: auto; color: #A39888; font-size: 12px; }

  .board { position: relative; display: flex; gap: 32px; padding: 24px; align-items: flex-start; width: max-content; overflow: visible; }
  #edge-layer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; overflow: visible; }

  .frame { width: 390px; flex: none; }
  .frame-label { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px; color: #8A7E6E; }
  .frame-label .chip {
    width: 20px; height: 20px; border-radius: 999px; background: #3D332A; color: #F4EFE8;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
  }
  .frame-label .rule { flex: 1; height: 1px; background: #E7DFD2; }

  .phone {
    width: 390px; height: 820px; border-radius: 28px; overflow: hidden;
    border: 1px solid #E7DFD2; background: #fff;
  }
  .phone-screen { padding: 24px 18px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
  .mock-header { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .mock-tabs { margin-top: auto; letter-spacing: 18px; color: #D9D0C2; font-size: 16px; }
  .mock-back { color: #A39888; font-size: 13px; }
  .mock-press {
    align-self: flex-start; font: inherit; font-size: 12px; padding: 6px 14px;
    border-radius: 8px; border: 1px solid #E7DFD2; background: #F4EFE8; cursor: pointer; color: #3D332A;
  }

  #switcher {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; z-index: 50;
    background: #26201A; color: #F4EFE8; border-radius: 999px; padding: 6px 16px;
    box-shadow: 0 6px 20px rgba(38, 32, 26, 0.28); font-size: 13px; letter-spacing: 0.01em;
  }
  #switcher button { background: transparent; border: 1px solid #5A5044; color: inherit; border-radius: 999px; width: 28px; height: 28px; padding: 0; }
</style>
</head>
<body>
  <div id="host"></div>
  <script src="./set2.js"></script>
</body>
</html>
