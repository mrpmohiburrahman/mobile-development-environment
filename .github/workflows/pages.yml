name: pages

# Publishes the read-only web export to GitHub Pages.
#
# The export bakes a token-server URL on port 9, which browsers block. So the
# public build edits tokens in memory and writes nothing.
#
# Pages serves this repository from /<repo-name>, so the export sets
# EXPO_BASE_URL to that subpath. Local builds leave it unset.
#
# Requires: Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the app
        working-directory: mobile
        run: npm ci

      - name: Export the read-only build
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npm run export:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ide
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
