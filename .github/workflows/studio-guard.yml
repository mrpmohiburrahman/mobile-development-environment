name: studio-guard

# The studio's credibility depends on the app tree staying byte-identical while
# the studio grows around it, unless a commit explicitly permits a named file
# and gives a reason via a `Guard-Allow: <path> -- <reason>` trailer. The studio
# renders real screens to make its claims demonstrable; if it can quietly edit
# those screens, the rendering proves nothing.
#
# scripts/guard.sh holds the logic and is covered by test/guard.test.ts. This
# workflow only decides which range to check and surfaces the result.
on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  # Screenshot comparison in the pinned Playwright image (ADR 0002). The job
  # runs on pull requests and on pushes to the default branch only. The runner
  # is arm64 because the baselines come from linux/arm64. `npm run vr` serves
  # the static export and compares. A skip fails here (VR_REQUIRE_COMPARE=1).
  # The job never writes or commits baselines.
  visual-regression:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --platform linux/arm64
    env:
      TZ: UTC
      VR_IMAGE: mcr.microsoft.com/playwright:v1.58.0-noble
      VR_REQUIRE_COMPARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the app
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Install the root tools
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts

      - name: Export the static build
        run: npm run export:web

      - name: Serve and compare screenshots
        run: npm run vr

      - name: Record the outcome
        if: always()
        run: node vr/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload the diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            test-results/playwright/**/*.png
            test-results/vr/
          if-no-files-found: ignore

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the guard is a three-dot range and needs the merge
          # base, which a shallow clone does not have. Without this the diff
          # either errors or silently compares the wrong two trees.
          fetch-depth: 0

      - name: App screens and shared components are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            # First push to a new branch has no meaningful `before`; fall back
            # to the default branch rather than diffing against the empty tree.
            #
            # The default branch *by name*, never `origin/HEAD`. That ref only
            # exists after a real `git clone` sets it. `actions/checkout` fetches
            # the history but never runs `git remote set-head`, so on the first
            # push of any new branch `origin/HEAD...HEAD` failed with
            # "bad revision" and took the guard down. The guard was unrunnable on
            # exactly the push that creates a branch.
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="origin/${{ github.event.repository.default_branch }}...HEAD"
            else
              range="$before...HEAD"
            fi
          fi
          echo "Guarding: $range"
          bash scripts/guard.sh "$range"

      - name: Test suite
        run: npm test